<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookstore App</title>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background: #f5f5f5;
    }
    h2 {
      color: #333;
    }
    input, button {
      padding: 8px;
      margin: 5px;
    }
    .book {
      background: #fff;
      padding: 10px;
      margin: 10px 0;
      border-left: 4px solid #007bff;
    }
  </style>
</head>
<body>

  <h2>Add Book</h2>
  <input type="text" id="title" placeholder="Title">
  <input type="text" id="author" placeholder="Author">
  <input type="number" id="price" placeholder="Price">
  <input type="text" id="genre" placeholder="Genre">
  <button onclick="addBook()">Add</button>

  <h2>All Books</h2>
  <button onclick="getBooks()">Load Books</button>
  <div id="books"></div>

  <script>
    const API = "http://localhost:3000";

    async function addBook() {
      const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        price: document.getElementById("price").value,
        genre: document.getElementById("genre").value
      };

      await fetch(`${API}/addBook`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(book)
      });

      alert("Book added!");
      getBooks();
    }

    async function getBooks() {
      const res = await fetch(`${API}/books`);
      const data = await res.json();

      const container = document.getElementById("books");
      container.innerHTML = "";

      data.forEach(book => {
        const div = document.createElement("div");
        div.className = "book";
        div.innerHTML = `
          <b>${book.title}</b> by ${book.author} <br>
          ₹${book.price} | ${book.genre} <br>
          <button onclick="deleteBook('${book._id}')">Delete</button>
          <button onclick="updateBook('${book._id}')">Update</button>
        `;
        container.appendChild(div);
      });
    }

    async function deleteBook(id) {
      await fetch(`${API}/deleteBook/${id}`, {
        method: "DELETE"
      });
      alert("Deleted!");
      getBooks();
    }

    async function updateBook(id) {
      const newTitle = prompt("Enter new title:");
      const newAuthor = prompt("Enter new author:");
      const newPrice = prompt("Enter new price:");
      const newGenre = prompt("Enter new genre:");

      await fetch(`${API}/updateBook/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          title: newTitle,
          author: newAuthor,
          price: newPrice,
          genre: newGenre
        })
      });

      alert("Updated!");
      getBooks();
    }
  </script>

</body>
</html>
