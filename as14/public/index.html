<!DOCTYPE html>
<html>
<head>
  <title>User List</title>
</head>
<body>

<h2>User List</h2>
<ul id="userList"></ul>

<script>
fetch('/api/users')
  .then(response => response.json())
  .then(data => {
    let output = '';
    data.forEach(user => {
      output += `<li>
        <b>${user.name}</b> - ${user.email}
      </li>`;
    });
    document.getElementById('userList').innerHTML = output;
  })
  .catch(err => console.log(err));
</script>

</body>
</html>
