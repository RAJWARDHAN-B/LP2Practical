<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0f2f5;
    }

    .top-bar {
      background-color: #3b5998;
      color: white;
      padding: 10px 0;
    }

    .logo {
      font-size: 40px;
      font-weight: bold;
      font-family: Arial, sans-serif;
    }

    .login-input {
      height: 30px;
      font-size: 14px;
    }

    .main-section {
      margin-top: 30px;
    }

    .signup-box input {
      margin-bottom: 10px;
    }

    .signup-btn {
      background-color: #42b72a;
      color: white;
      font-weight: bold;
    }

    .signup-btn:hover {
      background-color: #36a420;
    }

    .left-text {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .footer {
      margin-top: 50px;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>

<!-- Top Navbar -->
<div class="top-bar">
  <div class="container d-flex justify-content-between align-items-center flex-wrap">

    <div class="logo">facebook</div>

    <form class="d-flex align-items-center flex-wrap gap-2">
      <div>
        <input type="text" class="form-control login-input" placeholder="Email or Username">
      </div>
      <div>
        <input type="password" class="form-control login-input" placeholder="Password">
      </div>
      <button class="btn btn-light btn-sm">Login</button>
    </form>

  </div>
</div>

<!-- Main Section -->
<div class="container main-section">
  <div class="row">

    <!-- Left Side -->
    <div class="col-md-6 mb-4">
      <p class="left-text">
        Facebook is useless without friends. <br>
        Make More Friends.
      </p>

      <img src="https://source.unsplash.com/500x300/?network,people" class="img-fluid" alt="network">
    </div>

    <!-- Right Side (Signup) -->
    <div class="col-md-6">
      <h2>Create an Account</h2>
      <p class="text-muted">It's free and always will be.</p>

      <div class="signup-box">
        <div class="row">
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Firstname">
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Lastname">
          </div>
        </div>

        <input type="email" class="form-control" placeholder="Email">
        <input type="email" class="form-control" placeholder="Re-enter email">
        <input type="password" class="form-control" placeholder="Password">

        <input type="date" class="form-control">

        <div class="mt-2">
          <input type="radio" name="gender"> Male
          <input type="radio" name="gender" class="ms-3"> Female
        </div>

        <p class="mt-3 small text-muted">
          By clicking create an account, you agree to our Terms.
        </p>

        <button class="btn signup-btn w-50">Signup</button>

        <p class="mt-3">
          <a href="#">Create a page for you.</a>
        </p>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<div class="footer">
  English (UK) · Learn more...
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
