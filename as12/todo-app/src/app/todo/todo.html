<div class="container">
  <h2>To-Do List</h2>

  <!-- Add Task -->
  <input 
    [(ngModel)]="newTask" 
    placeholder="Enter a task"
  />
  <button (click)="addTask()">Add</button>

  <ul>
    <li *ngFor="let task of tasks; let i = index">

      <!-- View Mode -->
      <span *ngIf="!task.editing">
        {{ task.title }}
      </span>

      <!-- Edit Mode -->
      <input 
        *ngIf="task.editing"
        [(ngModel)]="task.title"
      />

      <!-- Buttons -->
      <button *ngIf="!task.editing" (click)="editTask(task)">
        Edit
      </button>

      <button *ngIf="task.editing" (click)="saveTask(task)">
        Save
      </button>

      <button (click)="deleteTask(i)">
        Delete
      </button>

    </li>
  </ul>
</div>
