<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

  <h2 class="mb-4 text-center">Event Registration Form</h2>

  <form class="needs-validation p-4 bg-white rounded shadow" novalidate>

    <!-- Name -->
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="name" placeholder="Name" required
        data-bs-toggle="tooltip" title="Enter your full name">
      <label for="name">Full Name</label>
      <div class="invalid-feedback">Name is required</div>
    </div>

    <!-- Email -->
    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="email" placeholder="Email" required
        data-bs-toggle="tooltip" title="Enter a valid email address">
      <label for="email">Email</label>
      <div class="invalid-feedback">Valid email is required</div>
    </div>

    <!-- Phone -->
    <div class="form-floating mb-3">
      <input type="tel" class="form-control" id="phone" placeholder="Phone" required
        data-bs-toggle="tooltip" title="Enter 10-digit mobile number">
      <label for="phone">Phone Number</label>
      <div class="invalid-feedback">Phone number required</div>
    </div>

    <!-- Event -->
    <div class="form-floating mb-3">
      <select class="form-select" id="event" required
        data-bs-toggle="tooltip" title="Select event type">
        <option value="">Choose...</option>
        <option>Workshop</option>
        <option>Seminar</option>
        <option>Hackathon</option>
      </select>
      <label for="event">Event Type</label>
      <div class="invalid-feedback">Please select an event</div>
    </div>

    <!-- Submit -->
    <button class="btn btn-primary w-100" type="submit">Register</button>

  </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Enable tooltips
const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
tooltipTriggerList.forEach(function (tooltipTriggerEl) {
  new bootstrap.Tooltip(tooltipTriggerEl);
});

// Form validation
(() => {
  const forms = document.querySelectorAll('.needs-validation');

  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }

      form.classList.add('was-validated');
    }, false);
  });
})();
</script>

</body>
</html>
